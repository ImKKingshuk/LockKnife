name: release

on:
  # One-time recovery trigger for the existing v1.2.0 release. Remove this
  # trigger after the repaired workflow has uploaded the release artifacts.
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to build and upload assets for
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || 'v1.2.0' }}

jobs:
  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --extra dev
      - run: uv run python scripts/check_repository_hygiene.py
      - name: Verify package version matches the release tag
        run: uv run python lockknife/core/version.py check "$RELEASE_TAG"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Install Gitleaks
        env:
          GOBIN: ${{ runner.temp }}/gitleaks-bin
        run: |
          mkdir -p "$GOBIN"
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Scan the complete Git history for secrets
        run: gitleaks git --redact --exit-code=2 --report-format=sarif --report-path=gitleaks-results.sarif --verbose
      - run: uv run maturin develop
      - run: uv run cargo test --workspace

  build-wheels:
    name: Build wheels — ${{ matrix.target }} (${{ matrix.os }})
    needs: [rust-tests]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux ──────────────────────────────────────────
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            # ring fails in the older auto-selected ARM cross image; use an
            # explicit newer manylinux cross image/toolchain for release builds.
            manylinux: "2_28"
          # ── macOS ──────────────────────────────────────────
          - os: macos-latest      # Apple Silicon runner
            target: aarch64-apple-darwin
            manylinux: "off"
          # ── Windows ────────────────────────────────────────
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: -m lockknife-core/Cargo.toml --release --out dist

      - name: Smoke test built wheel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import sys
          import tempfile
          import zipfile

          wheels = sorted(Path("dist").glob("*.whl"))
          if not wheels:
              raise SystemExit("No wheel artifacts found in dist/")

          extracted_dirs: list[Path] = []
          for wheel in wheels:
              extract_dir = Path(tempfile.mkdtemp(prefix=f"{wheel.stem}-"))
              with zipfile.ZipFile(wheel) as archive:
                  archive.extractall(extract_dir)

              entry_points = next(extract_dir.glob("*.dist-info/entry_points.txt"), None)
              if entry_points is None:
                  raise SystemExit(f"{wheel.name} is missing entry_points.txt")

              entry_text = entry_points.read_text(encoding="utf-8")
              if "lockknife=lockknife_headless_cli.main:cli" not in entry_text:
                  raise SystemExit(f"{wheel.name} is missing the lockknife console script entrypoint")

              if not (extract_dir / "lockknife_headless_cli" / "main.py").exists():
                  raise SystemExit(f"{wheel.name} is missing lockknife_headless_cli/main.py")

              extracted_dirs.append(extract_dir)

          subprocess.run(
              [
                  "uv",
                  "pip",
                  "install",
                  "--system",
                  "click>=8.5.0",
                  "rich>=15.0.0",
                  "jinja2>=3.1",
                  "defusedxml>=0.7",
                  "pydantic>=2.13.5",
                  "pydantic-settings>=2.15.0",
                  "structlog>=26.1.0",
              ],
              check=True,
          )

          env = os.environ.copy()
          env["PYTHONPATH"] = str(extracted_dirs[0]) + os.pathsep + env.get("PYTHONPATH", "")
          subprocess.run([sys.executable, "-m", "lockknife", "--version"], check=True, env=env)
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: -m lockknife-core/Cargo.toml --out dist

      - name: Smoke test built sdist
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import subprocess

          sdist = next(Path("dist").glob("*.tar.gz"))
          subprocess.run(["uv", "pip", "install", "--system", str(sdist)], check=True)

          exe = shutil.which("lockknife")
          if not exe:
              raise SystemExit("lockknife not found on PATH after sdist install")

          subprocess.run([exe, "--version"], check=True)
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz

  upload-release:
    name: Upload to GitHub Release
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: List built artifacts
        run: ls -lh dist/

      - name: Upload wheels & sdist to release
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          files: dist/*
          tag_name: ${{ env.RELEASE_TAG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
