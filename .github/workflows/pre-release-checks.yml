name: pre-release checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install cargo-deny
        run: cargo install cargo-deny
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --extra dev
      - run: uv run python scripts/check_repository_hygiene.py
      - name: Scan the complete Git history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: uv run maturin develop
      - run: uv run lockknife --version
      - run: uv run lockknife --cli --help
      - run: uv run python lockknife/core/version.py check
      - run: uv run cargo test --workspace
      - run: uv run cargo fmt --all --check
      - run: uv run cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo deny check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest --cov=lockknife --cov=lockknife_headless_cli --cov-report=term-missing --cov-fail-under=56
      - run: uv run bandit -c bandit.yaml -r lockknife lockknife_headless_cli --severity-level medium
      - run: uv run pip-audit

  build-check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          args: -m lockknife-core/Cargo.toml --release --out dist
      - name: Smoke test built wheel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import subprocess

          wheel = next(Path("dist").glob("*.whl"))
          subprocess.run(["uv", "pip", "install", "--system", str(wheel)], check=True)

          exe = shutil.which("lockknife")
          if not exe:
              raise SystemExit("lockknife not found on PATH after wheel install")

          subprocess.run([exe, "--version"], check=True)
          subprocess.run([exe, "--cli", "--help"], check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: check-wheels-${{ matrix.os }}
          path: dist/*
          retention-days: 3

  sdist-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: -m lockknife-core/Cargo.toml --out dist
      - name: Smoke test built sdist
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import subprocess

          sdist = next(Path("dist").glob("*.tar.gz"))
          subprocess.run(["uv", "pip", "install", "--system", str(sdist)], check=True)

          exe = shutil.which("lockknife")
          if not exe:
              raise SystemExit("lockknife not found on PATH after sdist install")

          subprocess.run([exe, "--version"], check=True)
          subprocess.run([exe, "--cli", "--help"], check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: check-sdist
          path: dist/*.tar.gz
          retention-days: 3
