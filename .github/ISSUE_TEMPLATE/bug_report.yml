name: Bug report
description: Report a reproducible LockKnife defect without including sensitive evidence.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, device identifiers, personal data, case files, or forensic evidence. Redact logs before attaching them.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence that reproduces the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LockKnife version
      placeholder: "1.1.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, device identifiers, personal data, and forensic evidence from this report.
          required: true
